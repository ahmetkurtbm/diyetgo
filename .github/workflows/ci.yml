name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: diyetgo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: diyetgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diyetgo -d diyetgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://diyetgo:ci-only-password@localhost:5432/diyetgo_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: VITE_DATA_MODE=demo npm run build
